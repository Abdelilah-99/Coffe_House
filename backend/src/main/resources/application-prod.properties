spring.application.name=blog-api

# Database Configuration - read from environment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
media.upload-dir=/root/Coffe_House/backend/uploads/

# JWT Security Configuration
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# Logging Configuration - Production (less verbose)
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.blog=INFO

# Ensure overall production logging is quiet to avoid heavy log I/O
logging.level.root=WARN

# Actuator: expose health and info (health allowed anonymously by security config)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never























