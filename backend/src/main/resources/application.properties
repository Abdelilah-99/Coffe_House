spring.application.name=blog-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blogdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:abdelilah}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:abdelilah}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.devtools.add-properties=true
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# spring.jpa.hibernate.ddl-auto=create
media.upload-dir=/root/Coffe_House/backend/uploads/
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY}
security.jwt.expiration-time=3600000
# Show handler mappings
# spring.jpa.open-in-view=false
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=TRACE
logging.level.org.springframework.web.filter=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.apache.catalina=DEBUG
logging.level.org.apache.coyote=DEBUG
# Show what's happening in the persistence context
logging.level.org.hibernate.event.internal=TRACE
logging.level.org.hibernate.engine.internal=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.security=TRACE
# Show SQL
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Show what entity fields changed
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Show the actual entity state
logging.level.org.hibernate.engine.internal.TwoPhaseLoad=DEBUG

# Show dirty checking details
logging.level.org.hibernate.event.internal.DefaultDirtyCheckEventListener=TRACE

# Expose actuator health/info locally for testing
management.endpoints.web.exposure.include=health,info
